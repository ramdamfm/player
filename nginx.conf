worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;
  client_max_body_size 16k;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  access_log /dev/stdout;

  limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://*.mzstatic.com; font-src 'self'; media-src https://azuracast.ramdam.fm blob:; connect-src 'self' https://azuracast.ramdam.fm wss://azuracast.ramdam.fm; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://ramdam.fm https://*.ramdam.fm;" always;

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options "nosniff" always;
      try_files $uri =404;
    }

    location /api/nowplaying/ {
      limit_req zone=api burst=10 nodelay;
      proxy_pass https://azuracast.ramdam.fm/api/nowplaying/;
      proxy_ssl_server_name on;
      proxy_set_header Host azuracast.ramdam.fm;
      proxy_set_header Accept application/json;
    }

    location /api/cover {
      limit_req zone=api burst=10 nodelay;
      proxy_pass https://itunes.apple.com/search;
      proxy_ssl_server_name on;
      proxy_set_header Host itunes.apple.com;
      proxy_set_header Accept application/json;
    }

    location ~ /\. {
      deny all;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
